    });
    if(!items.length) return;
    listEl.appendChild(el("h2","",c));
    var g = el("div","grid");
    items.forEach(function(p){g.appendChild(card(p)); shown++;});
    listEl.appendChild(g);
  });
  document.getElementById("empty").classList.toggle("hidden", shown>0);
}

function card(p){
  var c = el("div","card");
  c.appendChild(el("h3","",p.titulo));
  c.appendChild(el("span","tag",p.cat));
  var btns = el("div","btns");
  var bCode = el("button","b","Ver código");
  var bRun = el("button","b run","Ejecutar");
  btns.appendChild(bCode); btns.appendChild(bRun);
  c.appendChild(btns);
  var pre = el("pre","hidden"); pre.appendChild(el("code","",p.code));
  c.appendChild(pre);
  bCode.onclick = function(){
    pre.classList.toggle("hidden");
    bCode.textContent = pre.classList.contains("hidden") ? "Ver código" : "Ocultar código";
  };
  var panel = null;
  bRun.onclick = function(){
    if(panel){panel.remove(); panel=null; bRun.textContent="Ejecutar"; return;}
    panel = runPanel(p); c.appendChild(panel); bRun.textContent="Cerrar";
  };
  return c;
}

function runPanel(p){
  var wrap = el("div","run-panel");
  var inputs = p.prompts.map(function(lbl){
    var isC = typeof lbl==="object";
    var l = el("label","",isC?lbl.c:lbl); var i;
    if(isC){i=document.createElement("select"); [["1","Aceptar (Sí)"],["","Cancelar (No)"]].forEach(function(o){var op=el("option","",o[1]); op.value=o[0]; i.appendChild(op);});}
    else{i=el("input"); i.type="text";}
    l.appendChild(i); wrap.appendChild(l); return i;
  });
  var go = el("button","b run","▶ Correr programa");
  wrap.appendChild(go);
  var out = el("div","out","La salida aparecerá aquí.");
  var holder = el("div");
  wrap.appendChild(holder); wrap.appendChild(out);
  go.onclick = function(){
    var vals = inputs.map(function(i){return i.value});
    out.innerHTML = "";
    var shim = "<script>(function(){var V="+JSON.stringify(vals).replace(/</g,"\\u003c")+",i=0;function s(t,x){parent.postMessage({t:t,x:x},'*')}"+
      "window.prompt=function(q){if(i>=V.length){throw new Error('El programa pidió otro dato y ya no hay más campos.')}s('in',q+' → '+V[i]);return V[i++]};"+
      "window.alert=function(m){s('al',String(m))};"+
      "window.confirm=function(q){if(i>=V.length){throw new Error('El programa pidió otro dato y ya no hay más campos.')}var r=V[i++]==='1';s('in',q+' → '+(r?'Aceptar':'Cancelar'));return r};"+
      "console.log=function(){s('log',[].slice.call(arguments).join(' '))};"+
      "window.addEventListener('error',function(e){s('err',e.message)});})()<\/script>";
    var html = p.code.replace("<head>","<head>"+shim);
    holder.innerHTML = "";
    var f = document.createElement("iframe");
    f.setAttribute("sandbox","allow-scripts");
    function onMsg(e){
      if(e.source!==f.contentWindow) return;
      var d = e.data, line = el("div", d.t==="err"?"err":d.t==="al"?"al":d.t==="in"?"in":"", (d.t==="err"?"Error: ":d.t==="al"?"Alerta: ":d.t==="in"?"Dato: ":"")+d.x);
      out.appendChild(line);
    }
    window.addEventListener("message", onMsg);
    f.srcdoc = html;
    holder.appendChild(f);
    setTimeout(function(){ if(!out.children.length) out.textContent="(El programa no mostró mensajes; revisa la vista de arriba.)"; },500);
  };
  return wrap;
}

qEl.addEventListener("input", render);
render();
</script>
</body>
</html>
